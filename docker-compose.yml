services:
  mongodb:
    image: mongo:7.0
    container_name: ecommerce_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  invoice-service:
    build: ./services/invoice-service
    container_name: ecommerce_invoice_service
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:password123@mongodb:27017/ecommerce_db?authSource=admin
    depends_on:
      - mongodb

  recommendation-service:
    build: ./services/recommendation-service
    container_name: ecommerce_recommendation_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://admin:password123@mongodb:27017/ecommerce_db?authSource=admin
    depends_on:
      - mongodb

volumes:
  mongo_data:
  redis_data:
