services:
  mongodb:
    image: mongo:7.0
    container_name: prod_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - ecommerce_network

  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: always
    volumes:
      - redis_prod_data:/data
    networks:
      - ecommerce_network

  invoice-service:
    build: ./services/invoice-service
    container_name: prod_invoice_service
    restart: always
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:password123@mongodb:27017/ecommerce_db?authSource=admin
    depends_on:
      - mongodb
    ports:
      - "8080:8080"
    networks:
      - ecommerce_network

  recommendation-service:
    build: ./services/recommendation-service
    container_name: prod_recommendation_service
    restart: always
    environment:
      MONGO_URI: mongodb://admin:password123@mongodb:27017/ecommerce_db?authSource=admin
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    networks:
      - ecommerce_network

  web:
    build: ./web
    container_name: prod_web
    restart: always
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/ecommerce_db?authSource=admin
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: super_secret_auth_key_123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - mongodb
      - redis
      - invoice-service
      - recommendation-service
    ports:
      - "3000:3000"
    networks:
      - ecommerce_network

volumes:
  mongo_prod_data:
  redis_prod_data:

networks:
  ecommerce_network:
    driver: bridge
